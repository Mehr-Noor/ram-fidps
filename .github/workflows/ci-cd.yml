name: CI/CD Pipeline (Windows Self-Hosted)

on:
  push:
    branches:
      - main

env:
  KAFKA_BOOTSTRAP_SERVERS: "mock"
  IMAGE_NAME: csv-ingestor
  IMAGE_TAG: latest
  K8S_NAMESPACE: kafka
  SKIP_KAFKA: "true"

jobs:
  test:
    runs-on: self-hosted

    steps:
      # 1️⃣ پاکسازی فولدر موقت با retry برای جلوگیری از خطای EBUSY
      - name: Clean temp directory safely
        shell: powershell
        run: |
          Write-Host "Cleaning runner temp directory..."
          if (Test-Path $env:RUNNER_TEMP) {
            $attempts = 0
            $success = $false
            do {
              try {
                Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Force -ErrorAction SilentlyContinue |
                  Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
                Write-Host "Temp folder cleaned successfully."
                $success = $true
              } catch {
                Write-Host "⚠️ Attempt $($attempts+1) failed: $($_.Exception.Message)"
                Start-Sleep -Seconds 3
                $attempts++
              }
            } while (-not $success -and $attempts -lt 3)
          }

      # 2️⃣ انتظار کوتاه قبل از checkout برای آزاد شدن فایل‌ها
      - name: Wait before checkout
        shell: powershell
        run: Start-Sleep -Seconds 5

      # 3️⃣ Checkout با clean=true و fetch-depth=1
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      # 4️⃣ نصب Python و dependencies
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 5️⃣ اجرای تست‌ها
      - name: Run tests
        shell: powershell
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE"
          pytest --ignore=tests/integration/

  build-and-load:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Pre-clean temp directory
        shell: powershell
        run: |
          if (Test-Path $env:RUNNER_TEMP) {
            Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Force -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Build Docker image
        shell: powershell
        run: docker build -t ${env:IMAGE_NAME}:${env:IMAGE_TAG} .

      - name: Load image into Kind
        shell: powershell
        run: kind load docker-image ${env:IMAGE_NAME}:${env:IMAGE_TAG} --name kind

  deploy:
    needs: build-and-load
    runs-on: self-hosted

    steps:
      - name: Pre-clean temp directory
        shell: powershell
        run: |
          if (Test-Path $env:RUNNER_TEMP) {
            Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Force -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.33.1'

      - name: Configure kubeconfig
        shell: powershell
        run: |
          $env:KUBECONFIG = "$HOME\.kube\config"
          Write-Host "KUBECONFIG set to $env:KUBECONFIG"

      - name: Deploy to Kubernetes
        shell: powershell
        run: |
          kubectl set image deployment/csv-ingestor csv-ingestor=${env:IMAGE_NAME}:${env:IMAGE_TAG} -n ${env:K8S_NAMESPACE}
          kubectl rollout status deployment/csv-ingestor -n ${env:K8S_NAMESPACE}
