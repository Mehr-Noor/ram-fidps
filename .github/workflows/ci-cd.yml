name: CI/CD Pipeline (Windows Self-Hosted)

on:
  push:
    branches:
      - main

env:
  KAFKA_BOOTSTRAP_SERVERS: "mock"
  IMAGE_NAME: csv-ingestor
  IMAGE_TAG: latest
  K8S_NAMESPACE: kafka
  SKIP_KAFKA: "true"
  RUNNER_TEMP: C:\temp\runner\${{ github.run_id }}

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Prepare temp folder
        shell: powershell
        run: |
          Write-Host "Preparing isolated temp folder: $env:RUNNER_TEMP"
          if (!(Test-Path $env:RUNNER_TEMP)) {
            New-Item -Path $env:RUNNER_TEMP -ItemType Directory | Out-Null
          }
          Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Wait before checkout
        shell: powershell
        run: Start-Sleep -Seconds 3

      - name: Checkout repository
        uses: actions/checkout@v4.1.7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          

      - name: Wait after checkout
        shell: powershell
        run: Start-Sleep -Seconds 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        shell: powershell
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE"
          pytest --ignore=tests/integration/

  build-and-load:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Prepare temp folder
        shell: powershell
        run: |
          if (!(Test-Path $env:RUNNER_TEMP)) {
            New-Item -Path $env:RUNNER_TEMP -ItemType Directory | Out-Null
          }
          Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Checkout code
        uses: actions/checkout@v4.1.7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          

      - name: Wait after checkout
        shell: powershell
        run: Start-Sleep -Seconds 2

      - name: Build Docker image
        shell: powershell
        run: docker build -t ${env:IMAGE_NAME}:${env:IMAGE_TAG} .

      - name: Load image into Kind
        shell: powershell
        run: kind load docker-image ${env:IMAGE_NAME}:${env:IMAGE_TAG} --name kind

  deploy:
    needs: build-and-load
    runs-on: self-hosted

    steps:
      - name: Prepare temp folder
        shell: powershell
        run: |
          if (!(Test-Path $env:RUNNER_TEMP)) {
            New-Item -Path $env:RUNNER_TEMP -ItemType Directory | Out-Null
          }
          Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Checkout code
        uses: actions/checkout@v4.1.7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          temp-directory: ${{ env.RUNNER_TEMP }}

      - name: Wait after checkout
        shell: powershell
        run: Start-Sleep -Seconds 2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.33.1'

      - name: Configure kubeconfig
        shell: powershell
        run: |
          $env:KUBECONFIG = "$HOME\.kube\config"
          Write-Host "KUBECONFIG set to $env:KUBECONFIG"

      - name: Deploy to Kubernetes
        shell: powershell
        run: |
          kubectl set image deployment/csv-ingestor csv-ingestor=${env:IMAGE_NAME}:${env:IMAGE_TAG} -n ${env:K8S_NAMESPACE}
          kubectl rollout status deployment/csv-ingestor -n ${env:K8S_NAMESPACE}
