name: CI/CD Pipeline (Windows Self-Hosted)

on:
  push:
    branches:
      - main

env:
  KAFKA_BOOTSTRAP_SERVERS: "mock"
  IMAGE_NAME: csv-ingestor
  IMAGE_TAG: latest
  K8S_NAMESPACE: kafka
  SKIP_KAFKA: "true"

jobs:
  test:
    runs-on: self-hosted

    steps:
      # 1️⃣ پاکسازی فولدر موقت با retry برای جلوگیری از خطای EBUSY
      - name: Clean temp directory safely
        shell: powershell
        run: |
          Write-Host "Cleaning runner temp directory..."
          if (Test-Path $env:RUNNER_TEMP) {
            $attempts = 0
            $success = $false
            do {
              try {
                Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Force -ErrorAction SilentlyContinue |
                  Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
                Write-Host "Temp folder cleaned successfully."
                $success = $true
              } catch {
                Write-Host "⚠️ Attempt $($attempts+1) failed: $($_.Exception.Message)"
                Start-Sleep -Seconds 3
                $attempts++
              }
            } while (-not $success -and $attempts -lt 3)
          }

      # 2️⃣ انتظار کوتاه قبل از checkout برای آزاد شدن فایل‌ها
      - name: Wait before checkout
        shell: powershell
        run: Start-Sleep -Seconds 5

      # 3️⃣ Checkout با clean=true و fetch-depth=1
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      # 4️⃣ نصب Python و dependencies
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 5️⃣ اجرای تست‌ها
      - name: Run tests
        shell: powershell
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE"
          pytest --ignore=tests/integration/

  build-and-load:
    needs: test
    runs-on: self-hosted

    ste
